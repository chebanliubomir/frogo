services:
#  frontend:
#    build: "frontend"
#    ports:
#      - "2000:2000"

  backend:
    build: backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  postgres:
    image: "postgres:18-alpine"
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DATABASE: "frogo"
    volumes:
      - "/var/run/postgres/postgres.sock:/var/run/postgres/postgres.sock"
      - "postgres:/var/lib/postgresql/data"

volumes:
  postgres:
