name: CI for project "FROGO"
run-name: Project FROGO

on:
  push:

jobs:
  installation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.20.0 ]
        yarn-version: [ 1.22.22 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installing Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Installing Package manager ${{ matrix.yarn-version }}
        run: sudo apt install yarn

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Starting linters
        run: npx eslint . --fix

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Installing Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Installing Package manager ${{ matrix.yarn-version }}
        run: |
          sudo apt install yarn
          corepack enable

      - name: Setup Docker
        uses: docker/setup-docker-action@v4








